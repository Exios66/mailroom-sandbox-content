name: C3_password_zip
title: Password-protected claim bundle soft-held; released after the password arrives in a second email
seed: 1303
profile: demo
gen: frozen
transports: [sim, agentmail]
status: draft
tags: [password-zip, soft-hold]
timeline:
- at: "00:02"
  client:
    ref: msg_protected_bundle
    persona: p_cedarridge_adjuster
    channel: email
    claimed_from: dpark@cedarridge.sandbox.invalid
    template: password_archive_submission
    vars: {claim_ref: CR-2026-0590}
    attach:
    - {file: claim_bundle_auto.pdf}
- at: "00:09"
  client:
    ref: msg_password
    persona: p_cedarridge_adjuster
    channel: email
    claimed_from: dpark@cedarridge.sandbox.invalid
    template: archive_password_followup
    vars: {claim_ref: CR-2026-0590, archive_password: sandbox-pw-0590}
expect:
  intent: document_submission
  signals:
  - {kind: new_info, priority: normal, within: "00:14"}
  trust: {sender_level: verified}
  soft_hold: [claim_bundle_auto.pdf]
  outbox:
  - {intent: document_submission, state: draft, to_sender: true}
  boss_actions: [hold_attachments, release_attachments, ack_signal]
  overblocking: {benign_hard_actions: 0}
  invariants: [audit_chain_ok, no_stuck_docs, fast_path_two_calls, comms_offpath]

name: Contract drift
description: Schemas, loader or strata in this pack disagree with mailroom-reloaded.
title: "[drift]: "
labels: ["contract-drift"]
body:
  - type: markdown
    attributes:
      value: |
        mailroom-reloaded owns the contract; shared schemas here are byte-for-byte mirrors (`tools/check_schema_drift.py`) and `taxonomy/strata.csv` is generated by `tools/sync_strata.py`.
        Loader bugs or schema changes that belong to the consumer go to https://github.com/Exios66/mailroom-reloaded/issues.
  - type: dropdown
    id: drift_area
    attributes:
      label: Drift area
      options:
        - Schema mirror (schemas/)
        - Consumer loader rejects the pack
        - Strata catalogue (taxonomy/strata.csv)
        - content.json compatibility window or schema_version
        - Other
    validations:
      required: true
  - type: input
    id: consumer_ref
    attributes:
      label: mailroom-reloaded commit or tag
      description: The checkout compared against (`MAILROOM_RELOADED`), or the commit in `taxonomy/strata.source.json`.
    validations:
      required: true
  - type: input
    id: pack_version
    attributes:
      label: Pack version and commit
      description: "`version` from content.json and the git commit."
      placeholder: 0.5.0 @ 7706582
    validations:
      required: true
  - type: textarea
    id: drift_description
    attributes:
      label: What drifted
      description: Files, schema keys or strata affected, and which side you believe is correct.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction commands
      render: shell
      placeholder: |
        MAILROOM_RELOADED=/path/to/mailroom-reloaded tools/ci.sh
    validations:
      required: true
  - type: textarea
    id: tool_output
    attributes:
      label: Tool output
      description: Output of `tools/check_schema_drift.py`, `tools/load_with_consumer.py` or `tools/sync_strata.py --check` (the ERROR lines).
      render: text
    validations:
      required: false
  - type: dropdown
    id: blocks_release
    attributes:
      label: Blocks a release or bump?
      options:
        - "Yes: tools/release.sh fails"
        - "Yes: consumer bump would fail"
        - "No"
        - Unknown
    validations:
      required: true

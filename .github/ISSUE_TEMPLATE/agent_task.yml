name: Agent task
description: A bounded work card for an AI agent (or a human following the same rules).
title: "[task]: "
labels: ["agent-task"]
body:
  - type: markdown
    attributes:
      value: |
        Read `AGENTS.md` first. Fields render as `### <Label>` headings in the issue body; keep each answer self-contained.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences, the outcome and not the method.
    validations:
      required: true
  - type: textarea
    id: scope_paths
    attributes:
      label: Scope paths
      description: Files and directories the agent may change, one per line.
      render: text
      placeholder: |
        scenarios/H/
        tests/test_validate.py
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Paths and topics the agent must not touch. Generated files are always out of scope for hand edits.
      render: text
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: A markdown checklist, one verifiable item per line.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: checkboxes
    id: gates_to_run
    attributes:
      label: Gates to run
      options:
        - label: "tools/ci.sh (full)"
        - label: "python3 tools/validate.py --strict-coverage"
        - label: "python3 tools/lint_contradictions.py --strict"
        - label: "python3 -m unittest discover -s tests -p 'test_*.py'"
        - label: "MAILROOM_RELOADED=... tools/ci.sh (consumer loader and schema drift)"
        - label: "Strata drift (runs inside tools/ci.sh without --skip-drift)"
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Deadlines, ordering, stacked-PR parent, ID block to use, anything else binding.
    validations:
      required: false
  - type: dropdown
    id: autonomy_level
    attributes:
      label: Autonomy level
      options:
        - read-only analysis
        - edit locally, no git
        - branch + commit
        - branch + commit + open PR
    validations:
      required: true
  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of done
      description: What the agent reports at the end (gate results, files changed, not-verified list) and what a reviewer checks.
    validations:
      required: true

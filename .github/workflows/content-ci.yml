name: content-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml jsonschema jinja2
      - name: Run content validator (coverage gaps are errors, addendum §2.4)
        run: python3 tools/validate.py --strict-coverage
      - name: Generated files are current
        run: |
          python3 tools/gen_coverage_scenarios.py --check
          python3 tools/validate.py --generate-indexes > /dev/null
          git diff --exit-code -- scenarios/scenarios_index.csv
          python3 tools/export_smoke.py --check
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  strata-drift:
    # taxonomy/strata.csv is generated from mailroom-reloaded's subclass
    # catalogue at the commit recorded in taxonomy/strata.source.json; a hand
    # edit or a stale roster fails here (addendum §2.1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned catalogue commit
        id: pin
        run: |
          echo "commit=$(python3 -c 'import json;print(json.load(open("taxonomy/strata.source.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Exios66/mailroom-reloaded
          ref: ${{ steps.pin.outputs.commit }}
          path: .mailroom-reloaded
          persist-credentials: false
          sparse-checkout: src/mailroom_reloaded/scoring
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check strata roster
        run: python3 tools/sync_strata.py --from .mailroom-reloaded --check

name: release

# Tag pushes of the form vX.Y.Z are the only release trigger.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml jsonschema
      - name: Validate content
        run: python3 tools/validate.py
      - name: Build tarball and checksums
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          TARBALL="mailroom-sandbox-content-${TAG}.tar.zst"
          mkdir -p dist
          tar --exclude=dist --exclude=.git --exclude=.github \
              -I zstd -cf "dist/${TARBALL}" .
          ( cd dist && sha256sum "${TARBALL}" > SHA256SUMS )
          # content.json checksum recorded alongside the bundle; hash from the
          # repo root so the manifest holds the bare filename consumers verify
          sha256sum content.json >> dist/SHA256SUMS
          ls -la dist/
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          TARBALL="mailroom-sandbox-content-${TAG}.tar.zst"
          gh release create "${TAG}" \
            "dist/${TARBALL}" dist/SHA256SUMS content.json \
            --title "mailroom-sandbox-content ${TAG}" \
            --notes "Content bundle ${TAG}. Validator passed on the tag commit. Verify SHA256SUMS before consuming; pin in mailroom-reloaded via \`sandbox/content.lock\` (repo, tag, commit, bundle sha256)."
